# VILS BUS.COM — Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── BACKEND WEB SERVICE ──────────────────────────────────
  - type: web
    name: vils-bus-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        # Update this to your deployed Render frontend domain or custom domain
        value: https://vils-bus-frontend.onrender.com
      - key: DB_FILE_PATH
        value: ./data/db.json
      - key: APP_NAME
        value: VILS BUS.COM
      - key: APP_VERSION
        value: 2.0.0

  # ─── FRONTEND STATIC SITE ─────────────────────────────────
  - type: web
    runtime: static
    name: vils-bus-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticpublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vils-bus-backend.onrender.com
      - key: VITE_APP_NAME
        value: VILS BUS.COM
      - key: VITE_APP_VERSION
        value: 2.0.0
